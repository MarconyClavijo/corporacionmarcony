<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d6efd">

<title>Billetera Digital - Marcony Clavijo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#10131a;
color:white;
padding:20px;
}

.portada{
text-align:center;
padding:40px 20px;
}

.foto{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
border:4px solid white;
box-shadow:0 0 20px rgba(255,255,255,.2);
}

h1{
margin-top:20px;
font-size:32px;
}

.subtitulo{
color:#bbb;
margin:10px 0 25px;
}

button{
background:#0d6efd;
color:white;
border:none;
padding:15px 35px;
font-size:18px;
border-radius:40px;
cursor:pointer;
}

#documentos{
margin-top:40px;
}


.tarjeta{

display:block;
background:#1d2330;
color:white;
padding:20px;
margin-bottom:15px;
border-radius:18px;
text-decoration:none;
font-size:20px;
font-weight:bold;

box-shadow:0 5px 15px rgba(0,0,0,.3);

transition:.3s;

}


.tarjeta:hover{
transform:scale(1.03);
}


.descripcion{
font-size:14px;
color:#bbb;
margin-top:8px;
}


</style>

</head>


<body>


<div class="portada">


<img src="perfil.png" class="foto">


<h1>Marcony Clavijo</h1>

<p class="subtitulo">
Billetera Digital Personal
</p>


<button onclick="document.getElementById('documentos').scrollIntoView({behavior:'smooth'})">

Documentación del Vehículo

</button>


</div>



<div id="documentos">


<a href="Licencia.pdf" target="_blank" class="tarjeta">

🪪 Licencia de conducir

<div class="descripcion">
Documento digital de licencia
</div>

</a>



<a href="TARJETA PROPIEDAD.pdf" target="_blank" class="tarjeta">

🚗 Tarjeta de propiedad

<div class="descripcion">
Documento del vehículo
</div>

</a>



<a href="SOAT.pdf" target="_blank" class="tarjeta">

🛡️ SOAT

<div class="descripcion">
Seguro obligatorio vigente
</div>

</a>

</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
